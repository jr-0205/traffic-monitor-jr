name: Build TrafficMonitorJr

on:
  push:
    branches:
      - main
      - jr-modern-refresh
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'

      - name: Publish single EXE
        shell: pwsh
        run: |
          dotnet publish src/TrafficMonitorJr.App/TrafficMonitorJr.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts/win-x64

      - name: Verify output
        shell: pwsh
        run: |
          $exe = "artifacts/win-x64/TrafficMonitorJr.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó TrafficMonitorJr.exe"
          }

          $extra = Get-ChildItem "artifacts/win-x64" -File | Where-Object Name -ne "TrafficMonitorJr.exe"
          if ($extra) {
            Write-Host "Archivos adicionales generados:"
            $extra | Format-Table Name, Length
            throw "El build debe producir un único archivo distribuible."
          }

          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: TrafficMonitorJr-win-x64
          path: artifacts/win-x64/TrafficMonitorJr.exe
          if-no-files-found: error
